# GitLab CI/CD for Empire: Wargame of the Century
# Windows build using LDC2 and DUB

stages:
  - build
  - deploy

variables:
  LDC_VERSION: "1.38.0"

build-windows:
  stage: build
  tags:
    - windows
    - shell
  variables:
    ErrorActionPreference: stop
  before_script:
    # Install Chocolatey if not present
    - |
      if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
      }
    # Install LDC2 D compiler
    - choco install ldc -y --version $LDC_VERSION
    # Install Windows SDK for rc.exe resource compiler
    - choco install windows-sdk-10-version-2004-windbg -y
    - Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
    - refreshenv
    # Find and configure Windows SDK paths
    - |
      $sdkBase = "C:\Program Files (x86)\Windows Kits\10"
      $sdkPath = Get-ChildItem "$sdkBase\bin\*\x64\rc.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
      if ($sdkPath) {
        $sdkVersion = $sdkPath.Directory.Parent.Name
        $env:PATH = "$($sdkPath.DirectoryName);$env:PATH"
        $env:INCLUDE = "$sdkBase\Include\$sdkVersion\um;$sdkBase\Include\$sdkVersion\shared"
        Write-Host "Windows SDK version: $sdkVersion"
        Write-Host "Added to PATH: $($sdkPath.DirectoryName)"
        Write-Host "INCLUDE: $env:INCLUDE"
      } else {
        Write-Error "rc.exe not found in Windows SDK"
        exit 1
      }
    - ldc2 --version
    - dub --version
  script:
    # Clean cached build artifacts to ensure fresh build
    - Remove-Item -Path ".dub" -Recurse -Force -ErrorAction SilentlyContinue
    - Remove-Item -Path "empire.res" -Force -ErrorAction SilentlyContinue
    - Remove-Item -Path "empire.exe" -Force -ErrorAction SilentlyContinue
    # Compile Windows resources (pass each include path separately)
    - |
      $sdkBase = "C:\Program Files (x86)\Windows Kits\10"
      $sdkVersion = (Get-ChildItem "$sdkBase\Include" | Select-Object -Last 1).Name
      rc /nologo /i "$sdkBase\Include\$sdkVersion\um" /i "$sdkBase\Include\$sdkVersion\shared" /fo empire.res empire.rc
    # Build release version
    - dub build --build=release --compiler=ldc2 --force
  artifacts:
    name: "empire-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - empire.exe
      - "*.bmp"
      - "*.wav"
      - help.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

deploy-windows:
  stage: deploy
  tags:
    - windows
    - shell
  needs:
    - job: build-windows
      artifacts: true
  script:
    - 'net use R: \\192.168.100.22\releases gitlab /user:root'
    - '$destPath = "R:\$env:CI_PROJECT_NAME\$env:CI_COMMIT_REF_NAME"'
    - 'if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Path $destPath -Force }'
    - 'Copy-Item -Path "empire.exe" -Destination $destPath -Force'
    - 'Copy-Item -Path "*.bmp" -Destination $destPath -Force'
    - 'Copy-Item -Path "*.wav" -Destination $destPath -Force'
    - 'Copy-Item -Path "help.txt" -Destination $destPath -Force'
    - 'net use R: /delete'
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "main"
